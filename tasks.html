<script>
function toGit(value)
{
	var r1 = value.slice(1, -1).split(", json=");
	var r2 = (r1[0].split("pullrequest=")[1] || "").slice(1, -1).split(",").map(x => x.trim()).reduce((re, cu) => { var t = cu.split("="); re[t[0]] = t[1]; return re; }, {});
	var r3 = r1[1] ? JSON.parse(r1[1]) : {};
	
	return { ...r2, ...r3 };
}
